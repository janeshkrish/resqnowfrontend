apply plugin: 'com.android.application'
import groovy.json.JsonSlurper

def updatesEnabled = (project.findProperty('RESQNOW_APP_UPDATES_ENABLED') ?: 'false').toString()
if (!(updatesEnabled in ['true', 'false'])) {
    throw new GradleException('RESQNOW_APP_UPDATES_ENABLED must be true or false')
}
def acceptanceEnabled = (project.findProperty('RESQNOW_UPDATER_ACCEPTANCE') ?: 'false').toString()
if (!(acceptanceEnabled in ['true', 'false']) || (acceptanceEnabled == 'true' && System.getenv('RESQNOW_UPDATER_ACCEPTANCE_ONLY') != 'true')) {
    throw new GradleException('Updater acceptance variants require explicit fixture-only configuration')
}
def fixtureSigning = ['RESQNOW_ACCEPTANCE_KEYSTORE_PATH', 'RESQNOW_ACCEPTANCE_KEY_ALIAS', 'RESQNOW_ACCEPTANCE_STORE_PASSWORD', 'RESQNOW_ACCEPTANCE_KEY_PASSWORD'].collectEntries { name -> [(name): System.getenv(name)] }
def hasFixtureSigning = fixtureSigning.values().every { value -> value != null && !value.isEmpty() }
def suppliedCode = project.findProperty('RESQNOW_ANDROID_VERSION_CODE')
def suppliedName = project.findProperty('RESQNOW_ANDROID_VERSION_NAME')
if ((suppliedCode != null) != (suppliedName != null)) {
    throw new GradleException('Android version code and name must be provided together')
}
def checkedCode = 4
def checkedName = '1.3'
if (suppliedCode != null) {
    def rawCode = suppliedCode.toString()
    def rawName = suppliedName.toString()
    if (!(rawCode ==~ /[1-9][0-9]{0,9}/) || new BigInteger(rawCode) > 2147483647 ||
        rawName.trim().isEmpty() || rawName.length() > 60 || rawName.find(/[\p{Cntrl}]/)) {
        throw new GradleException('Invalid checked Android release version')
    }
    checkedCode = Integer.parseInt(rawCode)
    checkedName = rawName
}
def signingValues = ['RESQNOW_ANDROID_KEYSTORE_PATH', 'RESQNOW_ANDROID_KEY_ALIAS', 'RESQNOW_ANDROID_STORE_PASSWORD', 'RESQNOW_ANDROID_KEY_PASSWORD'].collectEntries { name -> [(name): System.getenv(name)] }
def hasOwnerSigning = signingValues.values().every { value -> value != null && !value.isEmpty() }

android {
    if (acceptanceEnabled == 'true') testBuildType 'updaterAcceptance'
    namespace = "com.resqnow1.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        manifestPlaceholders += [resqnowAppUpdatesEnabled: updatesEnabled]
        applicationId "com.resqnow1.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode checkedCode
        versionName checkedName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (acceptanceEnabled == 'true' && hasFixtureSigning) {
            acceptanceFixture {
                storeFile file(fixtureSigning.RESQNOW_ACCEPTANCE_KEYSTORE_PATH)
                storePassword fixtureSigning.RESQNOW_ACCEPTANCE_STORE_PASSWORD
                keyAlias fixtureSigning.RESQNOW_ACCEPTANCE_KEY_ALIAS
                keyPassword fixtureSigning.RESQNOW_ACCEPTANCE_KEY_PASSWORD
            }
        }
        if (hasOwnerSigning) {
            ownerRelease {
                storeFile file(signingValues.RESQNOW_ANDROID_KEYSTORE_PATH)
                storePassword signingValues.RESQNOW_ANDROID_STORE_PASSWORD
                keyAlias signingValues.RESQNOW_ANDROID_KEY_ALIAS
                keyPassword signingValues.RESQNOW_ANDROID_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        if (acceptanceEnabled == 'true') {
            updaterAcceptance {
                initWith debug
                debuggable true
                matchingFallbacks = ['debug']
                if (hasFixtureSigning) signingConfig signingConfigs.acceptanceFixture
            }
        }
        release {
            if (hasOwnerSigning) signingConfig signingConfigs.ownerRelease
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { task -> task.project == project && task.name in ['assembleUpdaterAcceptance', 'packageUpdaterAcceptance'] } && !hasFixtureSigning) {
        throw new GradleException('Acceptance APKs require an explicitly synthetic fixture signing key')
    }
    if (graph.allTasks.any { task -> task.project == project && task.name in ['assembleRelease', 'bundleRelease', 'packageRelease'] }) {
        if (acceptanceEnabled == 'true') throw new GradleException('Acceptance-only builds cannot be released')
        if (suppliedCode == null || updatesEnabled != 'true' || System.getenv('VITE_NATIVE_BUILD') != 'true' || System.getenv('VITE_APP_UPDATES_ENABLED') != 'true') {
            throw new GradleException('Release requires checked version overrides and enabled packaged/native updater build flags')
        }
        if (!hasOwnerSigning || !file(signingValues.RESQNOW_ANDROID_KEYSTORE_PATH).isFile()) {
            throw new GradleException('Release requires the existing owner signing key through environment-only configuration')
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.4.0'
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'com.google.firebase:firebase-messaging:24.1.0'
    implementation 'androidx.work:work-runtime:2.11.2'
    // Same artifact and version @capacitor/geolocation already ships; declared so the
    // app's live tracking service can compile against the fused location client.
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}

apply from: 'capacitor.build.gradle'
def servicesJSON = file('google-services.json')
if (!servicesJSON.exists()) {
    throw new GradleException("Missing android/app/google-services.json. Firebase Messaging cannot initialize without it.")
}

def googleServices
try {
    googleServices = new JsonSlurper().parse(servicesJSON)
} catch (Exception e) {
    throw new GradleException("Invalid google-services.json format in android/app/google-services.json", e)
}

def applicationIdValue = android.defaultConfig.applicationId
def hasMatchingClient = (googleServices?.client ?: []).any { client ->
    client?.client_info?.android_client_info?.package_name == applicationIdValue
}

if (!hasMatchingClient) {
    throw new GradleException(
        "google-services.json package_name does not match applicationId '${applicationIdValue}'."
    )
}

apply plugin: 'com.google.gms.google-services'
