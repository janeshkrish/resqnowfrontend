<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analytics collector test boundary</title></head><body><h1>Test-only native bridge simulation</h1><p>This exercises the real collector and backend. It does not test Android storage or APK installation.</p><button id="allow">Allow app analytics</button><button id="withdraw">Withdraw consent</button><button id="customer">Sign in customer</button><button id="technician">Sign in technician</button><button id="version">Report updated version</button><button id="restart">Restart collector</button><button id="admin">Open admin</button><p id="status" role="status">Ready</p><script type="module">
import {createAppAnalyticsClient} from '/src/lib/appAnalytics/client.ts';
const api='http://127.0.0.1:5192';const session=await (await fetch(api+'/__test/session')).json();
const secret=Array.from(crypto.getRandomValues(new Uint8Array(32)),b=>b.toString(16).padStart(2,'0')).join('');
const state={installationId:crypto.randomUUID(),installationSecret:secret,appId:'com.resqnow1.app',versionName:'1.3',versionCode:4,consentRevision:0,consentPolicyVersion:'2026-10-27',consentGranted:false,consentDecided:false,everConsented:false,acknowledgedRevision:0};
const native={getIdentity:async()=>({...state}),acknowledge:async({revision})=>{state.acknowledgedRevision=Math.max(state.acknowledgedRevision,revision);}};
const transport=(path,body,token,signal)=>fetch(api+'/api/app-analytics'+path,{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(body),signal});
let accounts={customer:null,technician:null};let client;
function start(){client=createAppAnalyticsClient({native,transport,enabled:true,isOnline:()=>navigator.onLine});client.setAccounts(accounts);client.start();}
start();window.addEventListener('online',()=>client.resume());
document.getElementById('allow').onclick=()=>{state.consentRevision++;state.consentGranted=true;state.consentDecided=true;state.everConsented=true;client.resume();document.getElementById('status').textContent='Consent granted';};
document.getElementById('withdraw').onclick=()=>{state.consentRevision++;state.consentGranted=false;client.resume();document.getElementById('status').textContent='Consent withdrawn';};
document.getElementById('customer').onclick=()=>{accounts={...accounts,customer:{id:session.customerId,getToken:()=>session.customerToken}};client.setAccounts(accounts);};
document.getElementById('technician').onclick=()=>{accounts={...accounts,technician:{id:session.technicianId,getToken:()=>session.technicianToken}};client.setAccounts(accounts);};
document.getElementById('version').onclick=()=>{state.versionName='1.4';state.versionCode=5;client.resume();};
document.getElementById('restart').onclick=()=>{client.stop();start();};
document.getElementById('admin').onclick=()=>{localStorage.setItem('resqnow_admin_token',session.adminToken);localStorage.setItem('resqnow_admin_user',JSON.stringify({id:session.adminId,email:'synthetic@example.invalid',name:'Test admin',role:'admin'}));location.href='/admin/app-installs';};
</script></body></html>
