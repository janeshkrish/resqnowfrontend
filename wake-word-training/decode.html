<!doctype html><meta charset=utf-8><title>decode</title><pre id=o></pre><script>
function wav(samples, rate){const b=new ArrayBuffer(44+samples.length*2),v=new DataView(b);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
w(0,'RIFF');v.setUint32(4,36+samples.length*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,samples.length*2,true);
for(let i=0;i<samples.length;i++){const s=Math.max(-1,Math.min(1,samples[i]));v.setInt16(44+i*2,s*32767,true)}return b}
(async()=>{const log=[];const n=Number(new URLSearchParams(location.search).get('n')||6);for(let i=1;i<=n;i++){const buf=await (await fetch(`r${i}.ogg`)).arrayBuffer();const ctx=new OfflineAudioContext(1,1,48000);const a=await ctx.decodeAudioData(buf);
const off=new OfflineAudioContext(1,Math.ceil(a.duration*16000),16000);const src=off.createBufferSource();src.buffer=a;src.connect(off.destination);src.start();const r=await off.startRendering();const d=r.getChannelData(0);
let peak=0,sum=0;for(const x of d){peak=Math.max(peak,Math.abs(x));sum+=x*x}
await fetch(`/out/r${i}.wav`,{method:'POST',body:wav(d,16000)});log.push(`r${i} ${a.duration.toFixed(2)}s rate=${a.sampleRate} ch=${a.numberOfChannels} peak=${peak.toFixed(3)} rms=${Math.sqrt(sum/d.length).toFixed(4)}`)}
document.getElementById('o').textContent=log.join('\n');document.title='done'})().catch(e=>{document.getElementById('o').textContent='ERR '+e;document.title='err'});
</script>
